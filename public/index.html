<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏦 Banco POO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff; min-height: 100vh; padding: 28px 16px;
  }
  h1 { text-align: center; font-size: 2.4rem; margin-bottom: 4px;
       text-shadow: 0 3px 12px rgba(0,0,0,.4); }
  .sub { text-align: center; color: #9fd8ff; margin-bottom: 26px; }
  .contas { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
  .card {
    background: rgba(255,255,255,.08); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.15); border-radius: 20px;
    padding: 24px; width: 320px; box-shadow: 0 12px 30px rgba(0,0,0,.35);
    transition: transform .2s;
  }
  .card:hover { transform: translateY(-4px); }
  .card h2 { font-size: 1.3rem; display: flex; justify-content: space-between; align-items: center; }
  .badge { font-size: .72rem; padding: 4px 10px; border-radius: 999px; font-weight: 700; }
  .Poupanca { background: #16a34a; }
  .Corrente { background: #2563eb; }
  .saldo { font-size: 2.6rem; font-weight: 800; margin: 14px 0; letter-spacing: -1px; }
  .saldo.flash { animation: pop .5s ease; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.18); color:#ffe066} 100%{transform:scale(1)} }
  input { width: 100%; padding: 11px; border-radius: 10px; border: none; font-size: 1rem; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; }
  button {
    flex: 1; padding: 11px; border: none; border-radius: 10px; cursor: pointer;
    font-weight: 700; font-size: .95rem; transition: filter .15s, transform .1s;
  }
  button:active { transform: scale(.96); }
  button:hover { filter: brightness(1.12); }
  .dep { background: #22c55e; color: #06280f; }
  .saq { background: #f97316; color: #2a1200; }
  .render {
    display: block; margin: 26px auto 0; width: 340px; padding: 16px;
    background: linear-gradient(90deg,#f59e0b,#ef4444); color: #fff;
    font-size: 1.05rem; border-radius: 14px;
  }
  .hack {
    max-width: 720px; margin: 34px auto 0; background: #1e293b;
    border: 1px solid #334155; border-radius: 16px; padding: 22px;
  }
  .hack h3 { color: #fca5a5; margin-bottom: 8px; }
  .hack button { background: #dc2626; color: #fff; margin-top: 12px; width: 100%; }
  pre {
    background: #0b1220; color: #7dd3fc; padding: 14px; border-radius: 10px;
    margin-top: 12px; white-space: pre-wrap; font-size: .9rem; min-height: 24px;
  }
  .msg { text-align:center; min-height: 24px; margin-top: 14px; font-weight: 700; color:#fca5a5; }
</style>
</head>
<body>
  <h1>🏦 Banco POO</h1>
  <p class="sub">Encapsulamento · Controle de Visibilidade · Polimorfismo</p>

  <div class="contas" id="contas"></div>

  <button class="render" onclick="render()">💸 Aplicar rendimento a TODAS as contas (polimorfismo)</button>
  <p class="msg" id="msg"></p>

  <div class="hack">
    <h3>🔒 Demonstração: o saldo é PRIVADO (#)</h3>
    <p>Vamos tentar "hackear" o saldo mexendo direto no campo <code>#saldo</code>...</p>
    <button onclick="hack()">Tentar burlar o saldo 😈</button>
    <pre id="out"></pre>
  </div>

<script>
  // ------ operacoes reais: falam com o backend (as classes de verdade) ------
  async function carregar() {
    const r = await fetch("/contas");
    const contas = await r.json();
    document.getElementById("contas").innerHTML = contas.map(c => `
      <div class="card">
        <h2>${c.titular} <span class="badge ${c.tipo}">${c.tipo}</span></h2>
        <div class="saldo" id="s${c.id}">R$ ${c.saldo.toFixed(2)}</div>
        <input id="v${c.id}" type="number" placeholder="valor" value="100">
        <div class="row">
          <button class="dep" onclick="op(${c.id},'depositar')">Depositar</button>
          <button class="saq" onclick="op(${c.id},'sacar')">Sacar</button>
        </div>
      </div>`).join("");
  }

  async function op(id, acao) {
    const valor = document.getElementById("v" + id).value;
    const r = await fetch(`/contas/${id}/${acao}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ valor })
    });
    const data = await r.json();
    msg(r.ok ? "" : "⚠️ " + data.erro);
    await carregar(); flash(id);
  }

  async function render() {
    const r = await fetch("/contas/0/render", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: "{}" });
    await r.json(); msg("✨ Poupança rendeu 5% · Corrente pagou tarifa — mesma chamada render()!");
    await carregar(); flash(0); flash(1);
  }

  function flash(id){ const e=document.getElementById("s"+id); if(e){e.classList.remove("flash"); void e.offsetWidth; e.classList.add("flash");} }
  function msg(t){ document.getElementById("msg").textContent = t; }

  // ------ demo de encapsulamento no proprio navegador ------
  class Cofre { #saldo = 5000; get saldo(){ return this.#saldo; } }
  function hack() {
    const cofre = new Cofre();
    let log = "";
    log += "cofre.saldo (getter) => R$ " + cofre.saldo + "\n\n";
    log += "Tentando: cofre.#saldo = 999999 ...\n";
    try {
      // isso nem compila se descomentado -> campo privado!
      eval("cofre.#saldo = 999999");
    } catch (e) {
      log += "❌ ERRO: " + e.message + "\n";
    }
    log += "\nTentando por fora: cofre['#saldo'] = 999999 ...\n";
    cofre["#saldo"] = 999999; // cria outra propriedade, NAO altera o privado
    log += "cofre.saldo continua => R$ " + cofre.saldo + " ✅ protegido!";
    document.getElementById("out").textContent = log;
  }

  carregar();
</script>
</body>
</html>
